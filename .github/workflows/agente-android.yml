# ============================================================
# ADIPACK MDM - ANDROID AGENT
# CI/CD automatizado para compilación, firma y distribución.
#
# DEBUG:
#   Siempre compila APK de pruebas y ejecuta Lint.
#
# RELEASE:
#   Compila APK firmado cuando existen los 4 Secrets.
#
# GITHUB RELEASES:
#   Publica automáticamente al crear un tag agente-v*.
#
# ARTIFACTS:
#   APK + SHA256 + información de compilación.
#   Retención: 90 días.
# ============================================================

name: Agente Android - ADIPACK MDM

on:
  push:
    branches:
      - main
      - master
    tags:
      - "agente-v*"
    paths:
      - "agent-android/**"
      - ".github/workflows/agente-android.yml"

  pull_request:
    paths:
      - "agent-android/**"
      - ".github/workflows/agente-android.yml"

  workflow_dispatch:

# Permisos mínimos para el proceso de compilación.
permissions:
  contents: read

# Evita ejecuciones simultáneas innecesarias.
concurrency:
  group: agente-android-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # JOB 1: COMPILACIÓN Y VALIDACIÓN
  # ==========================================================

  compilar:

    name: Compilar y validar agente Android

    runs-on: ubuntu-latest

    timeout-minutes: 40

    defaults:
      run:
        working-directory: agent-android

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      has_keystore: ${{ steps.signing.outputs.has_keystore }}

    env:
      MDM_VERSION_CODE: ${{ github.run_number }}

      # Comprueba si existe al menos un Secret de firma.
      HAS_ANY_SIGNING_SECRET: ${{ secrets.MDM_KEYSTORE_BASE64 != '' || secrets.MDM_KEYSTORE_PASS != '' || secrets.MDM_KEY_ALIAS != '' || secrets.MDM_KEY_PASS != '' }}

      # Sólo considera habilitada la firma si están los cuatro.
      HAS_KEYSTORE: ${{ secrets.MDM_KEYSTORE_BASE64 != '' && secrets.MDM_KEYSTORE_PASS != '' && secrets.MDM_KEY_ALIAS != '' && secrets.MDM_KEY_PASS != '' }}

    steps:

      # ------------------------------------------------------
      # 1. DESCARGAR CÓDIGO
      # ------------------------------------------------------

      - name: Descargar código fuente
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. VALIDAR GRADLE WRAPPER
      # ------------------------------------------------------

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # ------------------------------------------------------
      # 3. CONFIGURAR JAVA 17
      # ------------------------------------------------------

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------
      # 4. CONFIGURAR ANDROID SDK
      # ------------------------------------------------------
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # ------------------------------------------------------
      # 5. CONFIGURAR GRADLE Y CACHÉ
      # ------------------------------------------------------

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------
      # 6. IDENTIFICAR VERSIÓN
      # ------------------------------------------------------

      - name: Determinar versión del agente
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/agente-v* ]]; then

            VERSION="${GITHUB_REF_NAME#agente-v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::El tag debe tener formato agente-vX.Y.Z"
              exit 1
            fi

          else

            VERSION="1.0.${GITHUB_RUN_NUMBER}"

          fi

          if ! [[ "$MDM_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || \
             (( MDM_VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode fuera del rango permitido por Android"
            exit 1
          fi

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MDM_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo " ADIPACK MDM ANDROID"
          echo " Version: $VERSION"
          echo " Code: $MDM_VERSION_CODE"
          echo "======================================"

      # ------------------------------------------------------
      # 7. VALIDAR SECRETS
      # ------------------------------------------------------

      - name: Validar configuración de firma
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HAS_ANY_SIGNING_SECRET" == "true" && \
                "$HAS_KEYSTORE" != "true" ]]; then

            echo "::error::Configuración incompleta de firma."
            echo "Se requieren los cuatro Secrets:"
            echo "MDM_KEYSTORE_BASE64"
            echo "MDM_KEYSTORE_PASS"
            echo "MDM_KEY_ALIAS"
            echo "MDM_KEY_PASS"
            exit 1

          fi

          echo "has_keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            echo "Configuración Release: habilitada."
          else
            echo "::notice::Sin Secrets de firma. Se generará únicamente Debug."
          fi

      # ------------------------------------------------------
      # 8. RESTAURAR KEYSTORE
      # ------------------------------------------------------

      - name: Restaurar llave de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          MDM_KEYSTORE_BASE64: ${{ secrets.MDM_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/adipack-mdm.jks"

          printf '%s' "$MDM_KEYSTORE_BASE64" | \
            base64 --decode > "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::El archivo Keystore está vacío."
            exit 1
          fi

          chmod 600 "$KEYSTORE"

          echo "MDM_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore restaurado correctamente."

      # ------------------------------------------------------
      # 9. VALIDAR PROYECTO Y GRADLE
      # ------------------------------------------------------

      - name: Verificar entorno de compilación
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f gradlew ]]; then
            echo "::error::No se encontró gradlew."
            exit 1
          fi

          if [[ ! -f app/build.gradle && \
                ! -f app/build.gradle.kts ]]; then
            echo "::error::No se encontró la configuración Gradle de app."
            exit 1
          fi

          chmod +x gradlew

          java -version
          ./gradlew --version

      # ------------------------------------------------------
      # 10. COMPILAR DEBUG Y LINT
      # ------------------------------------------------------

      - name: Compilar APK Debug y ejecutar Lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleDebug \
            lintDebug

      # ------------------------------------------------------
      # 11. COMPILAR RELEASE FIRMADO
      # ------------------------------------------------------

      - name: Compilar APK Release firmado
        if: env.HAS_KEYSTORE == 'true'
        env:
          MDM_KEYSTORE_PASS: ${{ secrets.MDM_KEYSTORE_PASS }}
          MDM_KEY_ALIAS: ${{ secrets.MDM_KEY_ALIAS }}
          MDM_KEY_PASS: ${{ secrets.MDM_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      # ------------------------------------------------------
      # 12. VALIDAR APK Y PREPARAR DISTRIBUCIÓN
      # ------------------------------------------------------

      - name: Validar APK y preparar distribución
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$DEBUG_APK" ]]; then
            echo "::error::No se generó el APK Debug."
            exit 1
          fi

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 \
            -type d | sort -V | tail -n 1)"

          if [[ -z "$BT" || ! -x "$BT/apksigner" ]]; then
            echo "::error::No se encontró apksigner."
            exit 1
          fi

          mkdir -p dist

          # Copiar APK Debug.
          cp "$DEBUG_APK" \
            "dist/adipack-mdm-agente-${MDM_VERSION_NAME}-debug.apk"

          # Comprobar que Release exista cuando se habilitó firma.
          if [[ "$HAS_KEYSTORE" == "true" ]]; then

            if [[ ! -f "$RELEASE_APK" ]]; then
              echo "::error::No se generó app-release.apk."
              echo "Comprueba la configuración signingConfig de Gradle."
              exit 1
            fi

            cp "$RELEASE_APK" \
              "dist/adipack-mdm-agente-${MDM_VERSION_NAME}.apk"

          fi

          # Verificar cada APK.
          for APK in dist/*.apk; do

            echo "::group::Validando $APK"

            "$BT/apksigner" verify \
              --verbose \
              --print-certs \
              "$APK"

            "$BT/aapt" dump badging "$APK" | \
              grep -m 1 '^package:'

            echo "::endgroup::"

          done

          # Generar SHA-256.
          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )

          # Información de trazabilidad.
          {
            echo "PRODUCTO=ADIPACK MDM Android"
            echo "VERSION=$MDM_VERSION_NAME"
            echo "VERSION_CODE=$MDM_VERSION_CODE"
            echo "COMMIT=$GITHUB_SHA"
            echo "REF=$GITHUB_REF"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            if [[ "$HAS_KEYSTORE" == "true" ]]; then
              echo "BUILD_TYPE=DEBUG+RELEASE_SIGNED"
            else
              echo "BUILD_TYPE=DEBUG_ONLY"
            fi

          } > dist/BUILD_INFO.txt

          # Resumen de GitHub Actions.
          {
            echo "## ADIPACK MDM Android"
            echo ""
            echo "- Versión: $MDM_VERSION_NAME"
            echo "- VersionCode: $MDM_VERSION_CODE"
            echo "- Commit: $GITHUB_SHA"
            echo ""

            if [[ "$HAS_KEYSTORE" == "true" ]]; then
              echo "### Release firmado"
              echo "APK listo para distribución MDM."
            else
              echo "### Debug únicamente"
              echo "No utilizar en tablets de producción."
            fi

            echo ""
            echo "### SHA-256"
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------
      # 13. GUARDAR APK Y METADATOS
      # ------------------------------------------------------

      - name: Guardar APK y metadatos
        uses: actions/upload-artifact@v4
        with:
          name: adipack-mdm-${{ steps.version.outputs.version_name }}
          path: agent-android/dist/
          retention-days: 90
          if-no-files-found: error

      # ------------------------------------------------------
      # 14. GUARDAR INFORME LINT
      # ------------------------------------------------------

      - name: Guardar informe Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adipack-mdm-lint-${{ github.run_number }}
          path: agent-android/app/build/reports/lint-results-*.html
          retention-days: 90
          if-no-files-found: ignore

  # ==========================================================
  # JOB 2: PUBLICACIÓN EN GITHUB RELEASES
  # ==========================================================

  publicar:

    name: Publicar Release ADIPACK MDM

    needs:
      - compilar

    if: >-
      startsWith(github.ref, 'refs/tags/agente-v')
      && needs.compilar.outputs.has_keystore == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      # ------------------------------------------------------
      # 1. DESCARGAR ARTIFACTS
      # ------------------------------------------------------

      - name: Descargar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: adipack-mdm-${{ needs.compilar.outputs.version_name }}
          path: agent-android/dist/

      # ------------------------------------------------------
      # 2. COMPROBAR ARCHIVOS
      # ------------------------------------------------------

      - name: Validar archivos de publicación
        shell: bash
        run: |
          set -euo pipefail

          APK="agent-android/dist/adipack-mdm-agente-${GITHUB_REF_NAME#agente-v}.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::No existe el APK Release."
            exit 1
          fi

          if [[ ! -s agent-android/dist/SHA256SUMS.txt ]]; then
            echo "::error::No existe SHA256SUMS.txt."
            exit 1
          fi

          cd agent-android/dist
          sha256sum --check SHA256SUMS.txt

      # ------------------------------------------------------
      # 3. PUBLICAR GITHUB RELEASE
      # ------------------------------------------------------

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ADIPACK MDM ${{ needs.compilar.outputs.version_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            agent-android/dist/adipack-mdm-agente-${{ needs.compilar.outputs.version_name }}.apk
            agent-android/dist/SHA256SUMS.txt
            agent-android/dist/BUILD_INFO.txt
